schema_version: 1.0.0
task_id: support.intent-routing
version: 1.0.0
title: Route a customer support request
description: Classify a support message and select the operational queue.
domain: customer-support
tags: [classification, structured-output]
split: smoke
input_schema:
  type: object
  required: [message]
  properties:
    message:
      type: string
expected_output_schema:
  type: object
  additionalProperties: false
  required: [intent, urgency, route]
  properties:
    intent:
      type: string
    urgency:
      enum: [low, normal, high, critical]
    route:
      type: string
reference:
  intent: billing_refund
  urgency: normal
  route: billing
environment:
  kind: none
  network: none
  state_capture: metadata
evaluators:
  - evaluator_id: output-schema
    kind: json_schema
    version: 1.0.0
    weight: 1.0
  - evaluator_id: reference-answer
    kind: exact_match
    version: 1.0.0
    weight: 2.0
    config:
      expected:
        intent: billing_refund
        urgency: normal
        route: billing
  - evaluator_id: latency
    kind: latency_budget
    version: 1.0.0
    required: false
    weight: 0.1
    config:
      max_latency_ms: 5000
data_policy:
  privacy_level: internal
  retain_raw_days: 30
  retain_canonical_days: 365
  allow_training: true
  allow_private_reasoning: false
  redaction_mode: balanced
metadata:
  owner: agent-platform
