name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-trace-platform
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-trace-platform
          persist-credentials: false
      # uv.lock resolves this sibling as ../benchmark-audit-core; use its default branch.
      - uses: actions/checkout@v4
        with:
          repository: daoa0601/benchmark-audit-core
          path: benchmark-audit-core
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent-trace-platform/uv.lock
      - run: uv python install 3.11
      - run: uv sync --all-extras --locked
      - run: make check
