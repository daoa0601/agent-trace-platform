groups:
  - name: agenttrace-ingestion
    rules:
      - alert: AgentTraceCollectorNotReady
        expr: agenttrace_collector_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: AgentTrace collector cannot reach raw storage
      - alert: AgentTraceIngestionErrors
        expr: sum(rate(agenttrace_ingest_requests_total{outcome="error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: AgentTrace raw writes are failing
      - alert: AgentTraceHighDuplicateRate
        expr: >-
          sum(rate(agenttrace_duplicate_events_total[15m]))
          / clamp_min(sum(rate(agenttrace_ingested_events_total[15m])), 1) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 10% of collected events are byte-identical replays
      - alert: AgentTraceHighSpanErrorRate
        expr: >-
          sum(rate(agenttrace_span_calls_total{status_code="STATUS_CODE_ERROR"}[10m]))
          / clamp_min(sum(rate(agenttrace_span_calls_total[10m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of traced agent operations are failing
      - alert: AgentTraceSlowModelGeneration
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(agenttrace_span_duration_milliseconds_bucket{agenttrace_step_type="model_generation"}[10m])
            )
          ) > 30000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Model-generation p95 has exceeded 30 seconds
