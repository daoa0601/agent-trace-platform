services:
  zai-smoke:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    profiles: [live]
    command:
      - agenttrace
      - provider
      - zai-smoke
      - --endpoint-plan
      - general
      - --model
      - "${ZAI_MODEL:-glm-5.2}"
      - --thinking-mode
      - "${ZAI_THINKING_MODE:-disabled}"
      - --reasoning-effort
      - "${ZAI_REASONING_EFFORT:-max}"
      - --otlp-endpoint
      - http://otel-collector:4318
    environment:
      ZAI_API_KEY_FILE: /run/secrets/zai_api_key
    secrets:
      - zai_api_key
    depends_on:
      otel-collector:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

secrets:
  zai_api_key:
    file: "${ZAI_API_KEY_FILE_HOST:-./secrets/zai_api_key}"
